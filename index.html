<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asinhrom Music</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{g:'#C5A059',d:'#1A1A1A'},fontFamily:{s:['Inter','sans-serif']}}}}
</script>
<style>
body{background:#fff;color:#1A1A1A;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;height:4px;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;background:#C5A059;margin-top:-6px;box-shadow:0 2px 6px rgba(197,160,89,0.4)}
input[type=range]::-webkit-slider-runnable-track{background:#E5E5E5;height:4px;border-radius:2px}
.hide{display:none}.fade{animation:f .3s ease-out}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Фикс наложения: активная вкладка всегда выше */
.active-tab{z-index:20;pointer-events:auto;opacity:1}
.inactive-tab{z-index:10;pointer-events:none;opacity:0}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

<header class="pt-6 pb-4 px-6 flex justify-center bg-white/90 backdrop-blur sticky top-0 z-50">
<div class="relative flex bg-gray-100 rounded-full p-1 shadow-inner">
<div id="ind" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white rounded-full shadow-sm transition-all duration-300"></div>
<button onclick="sw('p')" class="z-10 w-28 py-2 text-sm font-medium transition-colors text-d" id="bp">Плеер</button>
<button onclick="sw('l')" class="z-10 w-28 py-2 text-sm font-medium transition-colors text-gray-500" id="bl">Медиатека</button>
</div>
</header>

<main class="flex-1 relative w-full max-w-md mx-auto overflow-hidden">
<!-- PLAYER -->
<section id="vp" class="absolute inset-0 flex flex-col items-center justify-center px-6 transition-opacity duration-300 active-tab">
<div class="w-64 h-64 bg-gray-50 rounded-2xl border border-g shadow-xl flex items-center justify-center mb-10 relative overflow-hidden group">
<svg class="w-20 h-20 text-g opacity-50 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
</div>
<h2 id="tt" class="text-2xl font-light text-d mb-2 truncate px-4 text-center">Нет треков</h2>
<p class="text-xs text-gray-400 uppercase tracking-widest mb-8">Asinhrom Music</p>
<div class="w-full mb-8">
<input type="range" id="pr" value="0" oninput="seek(this.value)">
<div class="flex justify-between mt-2 text-xs font-mono text-gray-400"><span id="ct">00:00</span><span id="td">00:00</span></div>
</div>
<div class="flex items-center gap-8">
<button onclick="prev()" class="text-gray-400 hover:text-g transition-colors"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M11 16.5v-9l-7 4.5M12 3.5a9 9 0 1 0 9 9 9 9 0 0 0-9-9z"/></svg></button>
<button onclick="toggle()" class="w-20 h-20 rounded-full border-2 border-g flex items-center justify-center text-g hover:bg-g hover:text-white transition-all shadow-lg shadow-g/20 active:scale-95">
<svg id="ip" class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
<svg id="ia" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
</button>
<button onclick="next()" class="text-gray-400 hover:text-g transition-colors"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M13 16.5v-9l7 4.5M12 3.5a9 9 0 1 0 9 9 9 9 0 0 0-9-9z"/></svg></button>
</div>
</section>

<!-- LIBRARY -->
<section id="vl" class="absolute inset-0 flex flex-col px-6 transition-opacity duration-300 inactive-tab overflow-y-auto pb-20">
<div class="mt-4 mb-8">
<label for="fu" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-g rounded-xl cursor-pointer bg-gray-50 hover:bg-white hover:shadow-md transition-all">
<svg class="w-8 h-8 mb-3 text-g" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
<p class="text-sm text-gray-500 font-medium">Добавить MP3</p>
</label>
<input id="fu" type="file" accept=".mp3,audio/mpeg" multiple class="hidden" onchange="addFiles(this.files)">
</div>
<div class="mb-8">
<h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Треки (<span id="tc">0</span>)</h3>
<div id="pl" class="space-y-3"></div>
</div>
<div class="mt-auto pt-6 border-t border-gray-100">
<h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">История</h3>
<ul id="hl" class="space-y-2 text-sm text-gray-500"></ul>
</div>
</section>
</main>

<script>
const S={p:[],i:-1,play:false};
const A=new Audio();
const E={
ind:document.getElementById('ind'),bp:document.getElementById('bp'),bl:document.getElementById('bl'),
vp:document.getElementById('vp'),vl:document.getElementById('vl'),
tt:document.getElementById('tt'),pr:document.getElementById('pr'),
ct:document.getElementById('ct'),td:document.getElementById('td'),
ip:document.getElementById('ip'),ia:document.getElementById('ia'),
pl:document.getElementById('pl'),tc:document.getElementById('tc'),hl:document.getElementById('hl')
};

function sw(t){
if(t==='p'){
E.ind.style.transform='translateX(0)';
E.bp.classList.replace('text-gray-500','text-d');E.bl.classList.replace('text-d','text-gray-500');
E.vp.classList.remove('inactive-tab');E.vp.classList.add('active-tab');
E.vl.classList.remove('active-tab');E.vl.classList.add('inactive-tab');
}else{
E.ind.style.transform='translateX(100%)';
E.bl.classList.replace('text-gray-500','text-d');E.bp.classList.replace('text-d','text-gray-500');
E.vl.classList.remove('inactive-tab');E.vl.classList.add('active-tab');
E.vp.classList.remove('active-tab');E.vp.classList.add('inactive-tab');
}
}

function addFiles(fs){
Array.from(fs).forEach(f=>{
if(f.type.startsWith('audio/')){
S.p.push({u:URL.createObjectURL(f),n:f.name.replace(/\.[^/.]+$/,"")});
}
});
render();
if(S.i===-1&&S.p.length)load(0);
}

function render(){
E.pl.innerHTML='';E.tc.innerText=S.p.length;
if(!S.p.length)return;
S.p.forEach((t,i)=>{
const a=i===S.i;
const d=document.createElement('div');
d.className=`flex items-center justify-between p-3 rounded-lg border transition-all ${a?'border-g bg-yellow-50/30':'border-gray-100 hover:border-g/50'}`;
d.innerHTML=`<span class="text-sm font-medium text-d truncate">${t.n}</span>
<button onclick="playT(${i})" class="text-xs font-semibold px-3 py-1 border ${a?'border-g text-g':'border-transparent text-gray-400 hover:border-g hover:text-g'}">${a&&S.play?'Играет':'Вкл'}</button>`;
E.pl.appendChild(d);
});
}

function load(i){
if(i<0||i>=S.p.length)return;
S.i=i;const t=S.p[i];
A.src=t.u;E.tt.innerText=t.n;E.pr.value=0;E.ct.innerText="00:00";
render();
if(S.play)A.play();
}

function playT(i){
if(S.i===i&&S.play){toggle();return;}
load(i);S.play=true;updBtn();A.play();
}

function toggle(){
if(!S.p.length)return;
S.play=!S.play;
S.play?A.play():A.pause();
updBtn();render();
}

function updBtn(){
S.play?(E.ip.classList.add('hide'),E.ia.classList.remove('hide')):(E.ip.classList.remove('hide'),E.ia.classList.add('hide'));
}

function next(){
if(!S.p.length)return;
let n=S.i+1;if(n>=S.p.length)n=0;
hist();load(n);if(S.play)A.play();
}

function prev(){
if(!S.p.length)return;
if(A.currentTime>3){A.currentTime=0;return;}
let n=S.i-1;if(n<0)n=S.p.length-1;
load(n);if(S.play)A.play();
}

function seek(v){
if(isNaN(A.duration))return;
A.currentTime=(v/100)*A.duration;
}

function hist(){
if(!S.p[S.i])return;
const li=document.createElement('li');
li.className="fade";
li.innerHTML=`<span class="w-1.5 h-1.5 rounded-full bg-g mr-2 inline-block"></span>${S.p[S.i].n}`;
E.hl.prepend(li);
if(E.hl.children.length>5)E.hl.removeChild(E.hl.lastChild);
}

A.addEventListener('timeupdate',()=>{
if(isNaN(A.duration))return;
E.pr.value=(A.currentTime/A.duration)*100;
E.ct.innerText=fmt(A.currentTime);
E.td.innerText=fmt(A.duration);
});

A.addEventListener('ended',next);

function fmt(s){
const m=Math.floor(s/60),sec=Math.floor(s%60);
return`${m<10?'0'+m:m}:${sec<10?'0'+sec:sec}`;
}
</script>
</body>
</html>
